# Real-data catalog. Structurally identical to catalog.synthetic.yaml --
# swapping OCEANUPS_CATALOG between them is the whole migration path.
#
# ---------------------------------------------------------------------------
# SOURCES (the dataset links named in the SIH 26067 problem statement)
# ---------------------------------------------------------------------------
#
# a. Numerical ocean model outputs
#    INCOIS Live Access Server   https://las.incois.gov.in/
#      Ferret LAS over a THREDDS Data Server; OPeNDAP under
#      https://las.incois.gov.in/thredds/dodsC/las/
#      Indian-Ocean SST, surface chlorophyll, winds, objectively-analysed
#      in-situ products, GODAS-MOM analysis, WOA09 climatology.
#      Consume server-side: a binary DAP response is not browser-consumable.
#
#    Copernicus GLORYS12V1       https://data.marine.copernicus.eu/product/GLOBAL_MULTIYEAR_PHY_001_030/description
#      GLOBAL_MULTIYEAR_PHY_001_030, DOI 10.48670/moi-00021.
#      1/12 degree, 50 levels (22 above 100 m), 1993-present, daily/monthly.
#      Free registration required. MOTU is deprecated; use the toolbox:
#
#        pip install copernicusmarine
#        copernicusmarine subset \
#          -i cmems_mod_glo_phy_my_0.083deg_P1D-m \
#          -v thetao -v so -v uo -v vo \
#          -x 80 -X 95 -y 5 -Y 22 -z 0 -Z 2000 \
#          -t 2023-01-01 -T 2023-01-31 \
#          -o data/derived -f glorys_bob.nc
#
#      Depth MUST reach 2000 m: a 1000 m subset leaves every deeper Argo
#      matchup with nothing to compare against.
#
#    Chlorophyll is NOT in GLORYS12 (physics only). Use the BGC reanalysis
#    GLOBAL_MULTIYEAR_BGC_001_029 (variable `chl`), which is 1/4 degree and
#    lower-frequency -- a different grid, deliberately kept on its own axes.
#
#        copernicusmarine subset \
#          -i cmems_mod_glo_bgc_my_0.25deg_P1D-m -v chl \
#          -x 80 -X 95 -y 5 -Y 22 -z 0 -Z 200 \
#          -t 2023-01-01 -T 2023-01-31 -o data/derived -f bgc_bob.nc
#
# b. Argo global data          ftp://ftp.ifremer.fr/ifremer/argo
#    HTTPS mirror (preferred)  https://data-argo.ifremer.fr/
#      Index files: ar_index_global_prof.txt, argo_synthetic-profile_index.txt.gz
#      QC reference table 2: 1 = good, 2 = probably good, 4 = bad.
#      INCOIS is itself a DAC: https://data-argo.ifremer.fr/dac/incois/
#
#        npm run fetch:real        # downloads Bay of Bengal floats and parses them
#        pip install argopy        # or: DataFetcher(mode="research").region(...)
#
# c. Glider data               ftp://ftp.ifremer.fr/ifremer/glider/v2/
#      EGO glider NetCDF (DOI 10.13155/34980). FTP only; the trajectory index
#      glider_traj_index.txt is 437 KB against 248 MB for the profile index,
#      so it is the way in.
#
#      Verified against the real GDAC, and both of these matter:
#        * A deployment file is a TIME SERIES, not a stack of profiles -- one
#          TIME dimension with PHASE marking descent (1) and ascent (4). The
#          parser cuts profiles at those inflexions.
#        * The index positions are not reliable: two deployments carry
#          transposed lat/lon (one claims the Bay of Bengal and is off
#          Svalbard). fetch_real.py confirms position from the file.
#
#      There are NO Bay of Bengal deployments in the GDAC: 131 of 1115 are
#      Indian Ocean, almost all Mozambique Channel.
#
# d. Collection of in-situ data (the problem statement link is missing)
#    Substitutes, in order of preference:
#      Copernicus In Situ TAC CORA  INSITU_GLO_PHY_TS_DISCRETE_MY_013_001
#                                   DOI 10.17882/46219
#      gridded analysis             INSITU_GLO_PHY_TS_OA_MY_013_052 (0.5 deg, 187 levels)
#      NOAA WOA23 (fetched, no account)  https://www.ncei.noaa.gov/products/world-ocean-atlas
#        npm run fetch:real -- --woa    # ~160 MB, subset to a 0.4 MB climatology
#      NOAA NCEI World Ocean Database  https://www.ncei.noaa.gov/products/world-ocean-database
#      INCOIS in-situ portals        https://incois.gov.in/portal/datainfo/
#    The ctd_csv parser exists so any of these can be dropped in as CSV
#    without touching the schema, the API or the frontend.
#
# Bathymetry: GEBCO 2024 grid, https://www.gebco.net/data_and_products/gridded_bathymetry_data/
# Climatology: Roemmich-Gilson Argo climatology (NOT CF-compliant -- needs
#   attribute repair), or INSITU_GLO_PHY_TS_OA_MY_013_052.
# ---------------------------------------------------------------------------

id: bob-glorys12
label: "Real: GLORYS12 + Argo (needs a Copernicus account)"
fetch: "copernicusmarine subset ... (see the header of this file)"
source: "GLORYS12V1 (CMEMS) - GLOBAL_MULTIYEAR_PHY_001_030, DOI 10.48670/moi-00021"
synthetic: false

model:
  uri: data/derived/glorys_bob.nc
  # Omit `engine` to sniff it from the file. GDAC and older products are
  # NetCDF-3 classic, which h5netcdf cannot read at all; Copernicus downloads
  # are NetCDF-4. Forcing one engine breaks whichever the other is.
  variables: {}

bgc:
  uri: data/derived/bgc_bob.nc
  variables:
    chlorophyll: chl

bathymetry:
  uri: data/raw/gebco_2024_bob.nc
  variable: elevation

climatology:
  # Built by `npm run fetch:real -- --woa` from NOAA WOA23, which is the World
  # Ocean Database objectively analysed onto a grid -- i.e. the "collection of
  # in-situ data" the problem statement asks for, with no account needed. It is
  # 1 degree against a 1/12 degree model; the anomaly service interpolates it
  # onto the model grid rather than requiring the two to match.
  uri: data/real/climatology_woa23_bob.nc

observations:
  - platform: argo
    parser: argo_netcdf
    uri: data/real/argo
  - platform: glider
    parser: glider_ego
    uri: data/real/glider

defaults:
  bbox: [80, 5, 95, 22]
  depth_range: [0, 2000]
  variable: temperature
